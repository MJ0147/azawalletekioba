[project]
name = "ekioba-frontend"
version = "1.0.0"
requires-python = ">=3.11"
# Keep in sync with requirements.txt.
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "aiofiles==24.1.0",
    "python-multipart==0.0.20",
    "tonsdk==1.0.15",
    "supabase==2.31.0",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.49",
    "asyncpg==0.31.0",
    "aiosqlite==0.22.1",
    "pynacl==1.6.2",
]

[tool.vercel]
# Deploy with the Vercel project's Root Directory set to `frontend`.
entrypoint = "app:app"
