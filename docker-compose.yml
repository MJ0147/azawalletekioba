services:
  store:
    build:
      context: ./store
      dockerfile: Dockerfile
    container_name: ekioba-store
    environment:
      PORT: "8001"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-key}
      # Supabase Postgres connection string; SQLite when unset.
      DATABASE_URL: ${STORE_DATABASE_URL:-sqlite:///db.sqlite3}
      SQLITE_DB_PATH: ${STORE_SQLITE_DB_PATH:-/app/db.sqlite3}
      TON_API_KEY: ${TON_API_KEY:-}
    ports:
      - "8001:8001"

  cargo:
    build:
      context: ./cargo
      dockerfile: Dockerfile
    container_name: ekioba-cargo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"

  hotels:
    build:
      context: ./hotels
      dockerfile: Dockerfile
    container_name: ekioba-hotels
    environment:
      PORT: "8003"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-key}
      # Supabase Postgres connection string; SQLite when unset.
      DATABASE_URL: ${HOTELS_DATABASE_URL:-}
      SQLITE_DB_PATH: ${HOTELS_SQLITE_DB_PATH:-/app/db.sqlite3}
    ports:
      - "8003:8003"

  language_academy:
    build:
      context: ./language_academy
      dockerfile: Dockerfile
    container_name: ekioba-language-academy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"

  ai_assistant:
    build:
      context: ./ai_assistant
      dockerfile: Dockerfile
    container_name: ekioba-ai-assistant
    environment:
      PORT: "8005"
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      IYOBO_MEMORY_DB_URL: ${IYOBO_MEMORY_DB_URL:-}
      IYOBO_ADMIN_TOKEN: ${IYOBO_ADMIN_TOKEN:-}
      IYOBO_USER_ID_SALT: ${IYOBO_USER_ID_SALT:-}
      KNOWLEDGE_BASE_DIR: /app/knowledge_base
    volumes:
      # Iyobo's main source; read-only so the assistant can't change it.
      - type: bind
        source: ./Knowledge Base
        target: /app/knowledge_base
        read_only: true
    ports:
      - "8005:8005"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ekioba-frontend
    depends_on:
      - store
      - ai_assistant
    environment:
      PORT: "3000"
      STORE_BACKEND_URL: ${STORE_BACKEND_URL:-http://store:8001/api/products/}
      STORE_PAYMENTS_URL: ${STORE_PAYMENTS_URL:-http://store:8001/payments/process/}
      AI_ASSISTANT_URL: ${AI_ASSISTANT_URL:-http://ai_assistant:8005}
      FRONTEND_IYOBO_URL: ${FRONTEND_IYOBO_URL:-/chat}
      TON_MERCHANT_WALLET: ${TON_MERCHANT_WALLET:-}
      IDIA_TON_JETTON_ADDRESS: ${IDIA_TON_JETTON_ADDRESS:-}
      DEDUST_FACTORY_ADDRESS: ${DEDUST_FACTORY_ADDRESS:-}
      USDT_NGN_RATE: ${USDT_NGN_RATE:-}
      FLW_SECRET_KEY: ${FLW_SECRET_KEY:-}
      FLW_API_BASE: ${FLW_API_BASE:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_ORDERS_TABLE: ${SUPABASE_ORDERS_TABLE:-orders}
      ORDERS_ADMIN_TOKEN: ${ORDERS_ADMIN_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "3000:3000"
